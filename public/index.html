         CANONICAL

         GOOGLE SEARCH CONSOLE VERIFICATION

    <!-- =====================================================
         GEO TAGS
         ===================================================== -->

    <meta
      name="geo.region"
      content="IN"
    />

    <meta
      name="geo.placename"
      content="India"
    />

    <meta
      property="og:site_name"
      content="Revoltant Solar Solutions"
    />

      property="og:title"

      content="https://www.revoltantsolarsolution.in/RevoltantLogo.webp"
    />

      property="og:image:alt"
      content="Revoltant Solar Solutions"
    />

    <meta
      property="og:image:width"
      content="1200"
    />

    <meta
      property="og:image:height"
      content="630"
    />

    <meta
      property="og:locale"
      content="en_IN"
    />

    <!-- =====================================================
         TWITTER CARD
         ===================================================== -->

    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="Revoltant Solar Solutions | Rooftop Solar, Pumps & EMI"

      name="twitter:description"

    <link

      as="image"

    />

    <!-- =====================================================

    <link
      rel="dns-prefetch"
      href="https://script.google.com"
    />

    <link
      rel="preconnect"
      href="https://script.google.com"

    />

    <link
      rel="dns-prefetch"
      href="https://wa.me"
    />

    <link
      rel="preconnect"
      href="https://wa.me"
      crossorigin

    <link
      rel="dns-prefetch"

      rel="preconnect"
